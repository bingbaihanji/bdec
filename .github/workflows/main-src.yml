name: Sync main-src branch

on:
  push:
    branches: [ master ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append-sync bdec sources to main-src
        run: |
          set -e
          # 准备 main-src 工作树(不存在则基于当前 master 创建)
          if git rev-parse --verify origin/main-src >/dev/null 2>&1; then
            git worktree add /tmp/main-src origin/main-src
          else
            git branch main-src HEAD
            git worktree add /tmp/main-src main-src
          fi

          # 用 master 的最新 bdec 源码整体替换 main-src 工作树
          cd /tmp/main-src
          git rm -rf . --quiet || true
          git checkout "${GITHUB_SHA}" -- src/main/java/com/bingbaihanji/bdec

          # 提交(有变更才提交,避免空提交)
          SHORT=$(git -C "$GITHUB_WORKSPACE" rev-parse --short "$GITHUB_SHA")
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "sync bdec sources from master $SHORT"
          git push origin HEAD:main-src
